<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حاسبة المدوَّر والمهدور</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<style>
*{margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:var(--sans)}
:root{
  --text:#1d1d1f;
  --text-2:#6e6e73; 
  --text-3:#86868b; 
  --text-4:#aeaeb2;
  --border:#CCCCCC; 
  --surface:#fff;
  --bg:#f5f5f7;
  --accent:#0066cc; 
  --danger:#ff3b30;
  --light-green:#00B295; 
  --light-green-text:#FFFFFF;
  --shadow:0 12px 32px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.04);
  --sans:"Cairo","SF Pro Text","Segoe UI",Tahoma,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --text:#f5f5f7; 
    --text-2:#a1a1a6; 
    --text-3:#8e8e93; 
    --text-4:#6e6e73;
    --border:#38383a; 
    --surface:#1c1c1e;
    --bg:#000;
    --accent:#4da3ff;
    --danger:#ff6961;
    --shadow:0 12px 32px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --text:#f5f5f7; 
  --text-2:#a1a1a6; 
  --text-3:#8e8e93; 
  --text-4:#6e6e73;
  --border:#38383a; 
  --surface:#1c1c1e; 
  --bg:#000;
  --accent:#4da3ff; 
  --danger:#ff6961;
  --shadow:0 12px 32px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.35);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased}
.n{font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1}
.hidden{display:none}
.wrap{max-width:820px;
  margin:0 auto;
  padding:24px 16px 48px}

.hero{text-align:center;
  padding:44px 16px 8px}
.hero h1{font-size:30px;
  font-weight:700;
  line-height:1.25;
  margin-bottom:10px}
.hero p{font-size:15px;
  color:var(--text-2);
  max-width:480px;
  margin:0 auto;
  line-height:1.6}

.card{
  max-width:680px;
  margin:22px auto 0;
  padding:28px 24px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:26px;
  box-shadow:var(--shadow);
}
.card-head{text-align:center;
  margin-bottom:22px}
.card-head h2{font-size:13px;
  font-weight:600;
  color:var(--text-3)}

.f-row{display:grid;
  padding:100%;
   ⁠grid-template-columns: 1fr;
  gap:22px;
  margin-bottom:6px;
  

}
@media(max-width:600px){.f-row{grid-template-columns:1fr;gap:14px}}
.lb{display:block;
  font-size:13px;
  color:var(--text-2);
  margin-bottom:6px;min-height:36px;
  line-height:1.4}

 .in{width:100%;
  border:1px solid var(--border);
  border-radius:12px;
  padding:11px 14px;
  font-size:15px;
  background:var(--bg);
  color:var(--text);
  transition:border-color .15s ease,box-shadow .15s ease}

  
 .in:focus{outline:none;
   border-color:var(--accent);
   box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}

 .thanks{border-top:1px solid var(--border);
   margin-top:22px;padding-top:22px}

 .btn-row{text-align:center;
   margin-top:26px}

  
 .btn{display:inline-block;
  font-size:15px;
  font-weight:600;
  color:var(--light-green-text);
  background:var(--light-green);
  border:none;
  border-radius:980px;
  padding:13px 44px;
  cursor:pointer;
  transition:opacity .15s ease,transform .1s ease}

 .btn:hover{opacity:.85}

 .btn:active{transform:scale(.97)}

 .err{font-size:13px;
  color:var(--danger);
  text-align:center;
  margin-top:14px;
  min-height:18px}

.res-row{display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:flex-start;
  gap:12px}

.res{
  border-radius:16px;
  padding:14px 18px;
  text-align:center;
}

.res .rt{font-size:13px;
  font-weight:600;
  color:var(--text-3);
  margin-bottom:6px;
  line-height:1.4}

.res .rv{font-size:19px;
  font-weight:600;
  line-height:1.35}

 .res .rd{font-size:12px;
   color:var(--text-4);
   margin-top:4px}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <h1>حاسبة الغبن</h1>
    <p>أدخل التواريخ الثلاثة وعدد التشكرات.</p>
  </header>

  <section class="card">
    <div class="card-head"><h3>أدخل البيانات</h3></div>
    <div class="f-row">
      <div>
        <label class="lb" for="d1">آخر ترقية قبل الاحتساب</label>
        <input class="in n" type="date" id="d1" value="2010-06-01">
      </div>
      <div>
        <label class="lb" for="d2">تاريخ احتساب الشهادة</label>
        <input class="in n" type="date" id="d2" value="2020-06-01">
      </div>
      <div>
        <label class="lb" for="d3">تاريخ نهاية التسريع</label>
        <input class="in n" type="date" id="d3" value="2025-01-01">
      </div>
      <div>
        <label class="lb" for="tm">جميع التشكرات منذ آخر استحقاق</label>
        <input class="in n" type="number" id="tm" min="0" value="">
      </div>
    </div>

    <div class="btn-row">
      <button class="btn" id="calcBtn" type="button">احسب</button>
    </div>
    <div class="err" id="err"></div>
  </section>

  <section class="card result-card hidden" id="resultsCard">
    <div class="card-head"><h3>النتيجة</h3></div>
    <div class="res-row">
      <div class="res">
        <div class="rt">المدوَّر+التشكرات</div>
        <div class="rv n" id="rmod">—</div>
        <div class="rd n" id="rmodd"></div>
        <div class="card-head"><h2>-------------------------------</h2></div>
        <div class="rt">المهدور</div>
        <div class="rv n" id="rmah">—</div>
        <div class="rd n" id="rmahd"></div>
        <div class="card-head"><h2>-------------------------------</h2></div>
        <div class="rt">المجموع</div>
        <div class="rv n" id="rgrand">—</div>
        <div class="rd n" id="rgrandd"></div>
     
    </div>
  </section>

</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  function days(a,b){return Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/86400000)}
  function br(a,b){
    var y=b.getFullYear()-a.getFullYear(),m=b.getMonth()-a.getMonth(),d=b.getDate()-a.getDate();
    if(d<0){m--;d+=new Date(b.getFullYear(),b.getMonth(),0).getDate()}
    if(m<0){y--;m+=12}
    return {y:y,m:m,d:d};
  }
  function f(o){return o.y+" سنة، "+o.m+" شهر، "+o.d+" يوم"}
  function fd(totalDays){
    var y=Math.floor(totalDays/365),r=totalDays-y*365,m=Math.floor(r/30),d=r-m*30;
    return y+" سنة، "+m+" شهر، "+d+" يوم";
  }
  function ps(s){return s?new Date(s+"T00:00:00"):null}
  function calc(){
    var d1=ps($("d1").value),d2=ps($("d2").value),d3=ps($("d3").value);
    var e="";
    if(!d1||!d2||!d3)e="يرجى إدخال التواريخ الثلاثة كاملة.";
    else if(d1>d2)e="تاريخ آخر عنوان يجب أن يكون قبل أو في تاريخ احتساب الشهادة.";
    else if(d2>d3)e="تاريخ احتساب الشهادة يجب أن يكون قبل أو في تاريخ نهاية التسريع.";
    $("err").textContent=e;
    if(e){
      $("resultsCard").classList.add("hidden");
      $("rmod").textContent=$("rmah").textContent=$("rgrand").textContent="—";
      $("rmodd").textContent=$("rmahd").textContent=$("rgrandd").textContent="";
      return;
    }
    var ma=br(d2,d3),md=days(d1,d2),hd=days(d2,d3);
    var tm=Math.max(0,parseInt($("tm").value)||0);
    var modAll=md+tm*30;
    var grand=modAll+hd;
    $("rmod").textContent=fd(modAll);
    $("rmodd").textContent="إجمالي الأيام: "+modAll+"";
    $("rmah").textContent=f(ma);
    $("rmahd").textContent="إجمالي الأيام: "+hd;
    $("rgrand").textContent=fd(grand);
    $("rgrandd").textContent="إجمالي الأيام: "+grand;
    $("resultsCard").classList.remove("hidden");
  }
  $("calcBtn").addEventListener("click",calc);
})();
</script>
</body>
</html>
