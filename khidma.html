<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حاسبة المدوَّر والمهدور وكتب الشكر</title>
<style>
:root{
  --text:#1d1d1f; --text-2:#6e6e73; --text-3:#86868b; --text-4:#aeaeb2;
  --border:#d2d2d7; --surface:#fff; --bg:#fbfbfd;
  --accent:#0066cc; --danger:#ff3b30;
  --sans:"SF Pro Text","Segoe UI",Tahoma,Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.n{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.wrap{max-width:820px;margin:0 auto;padding:24px 8px 40px}
.hero{text-align:center;padding:56px 16px 40px}
.hero h1{font-size:44px;font-weight:600;letter-spacing:0;line-height:1.15;margin-bottom:12px}
.hero p{font-size:17px;color:var(--text-2);max-width:560px;margin:0 auto;line-height:1.6}
.hr{height:1px;background:var(--border);margin-bottom:40px}
.sec{max-width:680px;margin:0 auto;padding:0 16px 40px}
.sec-t{font-size:13px;font-weight:600;color:var(--text-3);margin-bottom:20px;text-align:center;letter-spacing:.02em}
.f-row{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-bottom:8px}
@media(max-width:600px){.f-row{grid-template-columns:1fr;gap:16px}}
.lb{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px;min-height:36px;line-height:1.4}
.in{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:15px;font-family:inherit;background:var(--surface);color:var(--text);transition:border-color .15s ease}
.in:focus{outline:none;border-color:var(--text)}
.thanks{border-top:1px solid var(--border);margin-top:24px;padding-top:24px}
.btn-row{text-align:center;margin-top:28px}
.btn{display:inline-block;font-family:inherit;font-size:15px;font-weight:600;color:#fff;background:var(--text);border:none;border-radius:980px;padding:12px 40px;cursor:pointer;transition:opacity .15s ease}
.btn:hover{opacity:.85}
.btn:active{opacity:.7}
.err{font-size:13px;color:var(--danger);text-align:center;margin-top:16px;min-height:18px}

/* بطاقة النتائج العائمة */
.result-card{
  max-width:680px;margin:8px auto 0;padding:32px 28px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:24px;
  box-shadow:0 12px 32px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.04);
}
.result-card .sec-t{margin-bottom:24px}
.res-row{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:600px){.res-row{grid-template-columns:1fr}}
.res{
  border:1px solid var(--border);border-radius:16px;padding:18px 12px;text-align:center;
  background:var(--bg);
}
.res .rt{font-size:13px;font-weight:600;color:var(--text-3);margin-bottom:8px}
.res .rv{font-size:20px;font-weight:600;line-height:1.35}
.res .rd{font-size:12px;color:var(--text-4);margin-top:6px}
.res-b{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.res-r{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 4%,var(--surface))}
.res-k{border-color:var(--text)}
.res-total{grid-column:1/-1;border:2px solid var(--text);background:var(--surface)}
.res-total .rt{color:var(--text)}
.res-total .rv{font-size:24px}
.note{text-align:center;font-size:12px;color:var(--text-4);margin-top:20px}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <h1>حاسبة المدوَّر والمهدور.</h1>
    <p>أدخل التواريخ الثلاثة وعدد أشهر كتب الشكر، ثم اضغط زر «احسب» لاستخراج النتائج.</p>
  </header>
  <div class="hr"></div>

  <section class="sec">
    <h2 class="sec-t">أدخل البيانات</h2>
    <div class="f-row">
      <div>
        <label class="lb" for="d1">تاريخ آخر عنوان وظيفي قبل احتساب الشهادة</label>
        <input class="in n" type="date" id="d1" value="2010-06-01">
      </div>
      <div>
        <label class="lb" for="d2">تاريخ احتساب الشهادة</label>
        <input class="in n" type="date" id="d2" value="2020-06-01">
      </div>
      <div>
        <label class="lb" for="d3">تاريخ نهاية التسريع</label>
        <input class="in n" type="date" id="d3" value="2025-01-01">
      </div>
    </div>
    <div class="thanks">
      <div style="max-width:200px;margin:0 auto">
        <label class="lb" for="tm" style="min-height:auto">كتب الشكر من آخر استحقاق قبل الاحتساب لحد نهاية التسريع</label>
        <input class="in n" type="number" id="tm" min="0" value="0">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn" id="calcBtn" type="button">احسب</button>
    </div>
    <div class="err" id="err"></div>
  </section>

  <div class="result-card">
    <h2 class="sec-t">النتائج</h2>
    <div class="res-row">
      <div class="res res-b">
        <div class="rt">المدوَّر</div>
        <div class="rv n" id="rmod">—</div>
        <div class="rd n" id="rmodd"></div>
      </div>
      <div class="res res-r">
        <div class="rt">المهدور</div>
        <div class="rv n" id="rmah">—</div>
        <div class="rd n" id="rmahd"></div>
      </div>
      <div class="res res-total">
        <div class="rt">المجموع الكلي<br>(المدوَّر + المهدور + كتب الشكر)</div>
        <div class="rv n" id="rgrand">—</div>
        <div class="rd n" id="rgrandd"></div>
      </div>
    </div>
    <p class="note">عند جمع كتب الشكر يُعتمد تحويل: الشهر = 30 يومًا، السنة = 365 يومًا.</p>
  </div>

</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  function days(a,b){return Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/86400000)}
  function br(a,b){
    var y=b.getFullYear()-a.getFullYear(),m=b.getMonth()-a.getMonth(),d=b.getDate()-a.getDate();
    if(d<0){m--;d+=new Date(b.getFullYear(),b.getMonth(),0).getDate()}
    if(m<0){y--;m+=12}
    return {y:y,m:m,d:d};
  }
  function f(o){return o.y+" سنة، "+o.m+" شهر، "+o.d+" يوم"}
  function fd(totalDays){
    var y=Math.floor(totalDays/365),r=totalDays-y*365,m=Math.floor(r/30),d=r-m*30;
    return y+" سنة، "+m+" شهر، "+d+" يوم";
  }
  function ps(s){return s?new Date(s+"T00:00:00"):null}
  function calc(){
    var d1=ps($("d1").value),d2=ps($("d2").value),d3=ps($("d3").value);
    var e="";
    if(!d1||!d2||!d3)e="يرجى إدخال التواريخ الثلاثة كاملة.";
    else if(d1>d2)e="تاريخ آخر عنوان يجب أن يكون قبل أو في تاريخ احتساب الشهادة.";
    else if(d2>d3)e="تاريخ احتساب الشهادة يجب أن يكون قبل أو في تاريخ نهاية التسريع.";
    $("err").textContent=e;
    if(e){
      $("rmod").textContent=$("rmah").textContent=$("rtot").textContent=$("rgrand").textContent="—";
      $("rmodd").textContent=$("rmahd").textContent=$("rtotd").textContent=$("rgrandd").textContent="";
      return;
    }
    var mo=br(d1,d2),ma=br(d2,d3),md=days(d1,d2),hd=days(d2,d3);
    var tm=Math.max(0,parseInt($("tm").value)||0);
    var tot=mah=hd+tm*30;
    var grand=md+hd+tm*30;
    $("rmod").textContent=f(mo);
    $("rmodd").textContent="إجمالي الأيام: "+md;
    $("rmah").textContent=f(ma);
    $("rmahd").textContent="إجمالي الأيام: "+hd;
    $("rtot").textContent=fd(tot);
    $("rtotd").textContent="إجمالي الأيام: "+tot+" (شاملًا كتب الشكر)";
    $("rgrand").textContent=fd(grand);
    $("rgrandd").textContent="إجمالي الأيام: "+grand;
  }
  $("calcBtn").addEventListener("click",calc);
})();
</script>
</body>
</html>
